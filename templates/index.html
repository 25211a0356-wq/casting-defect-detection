<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metal Casting Defect Inspection</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; text-align: center; padding: 40px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        input[type="file"] { margin: 20px 0; }
        button { background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #result-box { margin-top: 25px; padding: 15px; border-radius: 8px; display: none; }
        .ok { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .defective { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>Casting Defect Inspector</h2>
    <p>Upload a cast metal image to check quality status.</p>
    
    <input type="file" id="imageInput" accept="image/*">
    <br>
    <button onclick="uploadImage()">Analyze Image</button>

    <div id="result-box">
        <h3 id="resultText"></h3>
        <p id="confidenceText"></p>
    </div>
</div>

<script>
async function uploadImage() {
    const fileInput = document.getElementById('imageInput');
    if (!fileInput.files[0]) {
        alert("Please select an image first!");
        return;
    }

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);

    const response = await fetch("/predict", {
        method: "POST",
        body: formData
    });

    const data = await response.json();
    const resultBox = document.getElementById('result-box');
    const resultText = document.getElementById('resultText');
    const confidenceText = document.getElementById('confidenceText');

    if (data.status === "success") {
        resultBox.style.display = "block";
        resultText.innerText = "Status: " + data.result;
        confidenceText.innerText = "Confidence: " + data.confidence;

        if (data.result.includes("OK")) {
            resultBox.className = "ok";
        } else {
            resultBox.className = "defective";
        }
    } else {
        alert("Error: " + data.error);
    }
}
</script>

</body>
</html>
