<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casting Defect Inspector</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .card { background: white; max-width: 450px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input[type="file"] { margin: 20px 0; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #result-box { margin-top: 25px; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 18px; display: none; }
        .success { background-color: #e2f0d9; color: #385723; }
        .error { background-color: #fce4d6; color: #c65911; }
    </style>
</head>
<body>

<div class="card">
    <h2>Metal Casting Defect Inspector</h2>
    <p>Upload a casting image to analyze</p>
    
    <form id="upload-form">
        <input type="file" id="image-input" accept="image/*" required><br>
        <button type="submit" id="analyze-btn">Analyze Image</button>
    </form>

    <div id="result-box"></div>
</div>

<script>
    document.getElementById('upload-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const fileInput = document.getElementById('image-input');
        const btn = document.getElementById('analyze-btn');
        const resultBox = document.getElementById('result-box');
        
        if (!fileInput.files[0]) {
            alert('Please select an image first.');
            return;
        }

        btn.innerText = 'Analyzing... Please wait';
        btn.disabled = true;
        resultBox.style.display = 'none';

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        try {
            const response = await fetch('/predict', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (response.ok && !data.error) {
                resultBox.className = 'success';
                resultBox.innerHTML = `Result: ${data.prediction}<br>Confidence: ${data.confidence}`;
                resultBox.style.display = 'block';
            } else {
                resultBox.className = 'error';
                resultBox.innerHTML = `Error: ${data.error || 'Prediction failed'}`;
                resultBox.style.display = 'block';
            }
        } catch (err) {
            alert('Server error or timeout. Please check your Render logs.');
            console.error(err);
        } finally {
            btn.innerText = 'Analyze Image';
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
